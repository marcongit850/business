# Serves https://waltonleaders.org and www.waltonleaders.org.
# Custom domains are attached in Cloudflare. Do not remove them from this file's deploy.
name = "business-preview"
main = "src/index.js"
compatibility_date = "2026-11-07"
workers_dev = true

# Sign-in mail uses hello@waltonleaders.org. Applicant thank-you mail uses each network hello@ address.
# Notices to marc@whpinc.com still use this binding, from marc@2911studio.com.
# No destination limit. Does not change DNS or Email Routing.
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = [
  "hello@waltonleaders.org",
  "hello@waltonbuildersnetwork.org",
  "hello@waltontourism.org",
  "marc@2911studio.com",
]

[observability]
enabled = true

[observability.logs]
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "walton-hub"
database_id = "be08bd25-0a50-4148-ac09-c201b58c6e6d"

[[r2_buckets]]
binding = "HUB_MEDIA"
bucket_name = "walton-hub-media"

[vars]
ADMIN_EMAILS = "marc@whpinc.com"
MAILERLITE_GROUP_MASTER = "204225136696493336"
MAILERLITE_GROUP_BUSINESS = "204225137081320769"
MAILERLITE_GROUP_BUILDERS = "204225138229511712"
MAILERLITE_GROUP_TOURISM = "204225138526258910"
MAILERLITE_GROUP_BUSINESS_APPROVED = "204225138578687754"
MAILERLITE_GROUP_BUILDERS_APPROVED = "204225138819860402"
MAILERLITE_GROUP_TOURISM_APPROVED = "204225140788037399"
